name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go.mod and go.sum must be what go mod tidy leaves; an upgrade
      # that skips it leaves stale hashes behind.
      - name: Tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Race detector on, test order shuffled: the suite must not depend
      # on ordering or on goroutines that happen to finish in time.
      - name: Test
        run: go test -race -shuffle=on ./...

      # End-to-end smoke tests build the binary and drive it through the
      # CLI, HTTP API, queue, webhooks and agents. Bash only.
      - name: Smoke
        if: runner.os != 'Windows'
        run: bash test/run.sh

      - name: Lint
        if: runner.os == 'Linux'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...

      - name: Dead code
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          out=$(deadcode -test ./...); if [ -n "$out" ]; then echo "$out"; exit 1; fi
