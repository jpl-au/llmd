syntax = "proto3";

package llmd.plugin;

option go_package = "./plugin";

// go:plugin type=plugin version=1
// Plugin is the interface that all llmd plugins must implement.
// The host calls these methods to interact with the plugin.
service Plugin {
  // Init is called once when the plugin loads. Returns the plugin manifest.
  rpc Init(InitRequest) returns (Manifest);

  // ExecuteCommand executes a command and returns the result.
  rpc ExecuteCommand(CommandRequest) returns (CommandResponse);

  // HandleEvent is called when a subscribed event occurs.
  rpc HandleEvent(Event) returns (Empty);

  // Shutdown is called when the plugin is being unloaded.
  rpc Shutdown(Empty) returns (Empty);
}

message Empty {}

message InitRequest {
  string host_version = 1;
}

message Manifest {
  string name = 1;
  string version = 2;
  string author = 3;
  string description = 4;
  string min_host_version = 5;
  repeated Command commands = 6;
  repeated string subscribed_events = 7;
}

message Command {
  string name = 1;
  string description = 2;
  string usage = 3;
  repeated Flag flags = 4;
  bool mcp_enabled = 5;
  string mcp_name = 6;
}

message Flag {
  string name = 1;
  string short = 2;
  string type = 3;  // string, int, bool, stringSlice
  string default = 4;
  string description = 5;
  bool required = 6;
}

message CommandRequest {
  string command = 1;
  repeated string args = 2;
  map<string, string> flags = 3;
  ExecutionContext context = 4;
}

message ExecutionContext {
  Interface interface = 1;
  string author = 2;
  OutputFormat format = 3;
  map<string, string> env = 4;
}

enum Interface {
  INTERFACE_CLI = 0;
  INTERFACE_MCP = 1;
  INTERFACE_API = 2;
}

enum OutputFormat {
  FORMAT_TEXT = 0;
  FORMAT_JSON = 1;
  FORMAT_TABLE = 2;
}

message CommandResponse {
  bool success = 1;
  string output = 2;
  OutputFormat format = 3;
  string error = 4;
}

message Event {
  string type = 1;
  string path = 2;
  int32 version = 3;
  string author = 4;
  int64 timestamp = 5;
  map<string, string> metadata = 6;
}
