syntax = "proto3";

package llmd.host;

option go_package = "./host";

// go:plugin type=host
// Host provides all host API operations to plugins.
service Host {
  // Document operations
  rpc DocumentRead(ReadRequest) returns (DocumentResponse);
  rpc DocumentWrite(WriteRequest) returns (DocumentResponse);
  rpc DocumentEdit(EditRequest) returns (DocumentResponse);
  rpc DocumentDelete(DeleteRequest) returns (EmptyResponse);
  rpc DocumentRestore(RestoreRequest) returns (DocumentResponse);
  rpc DocumentList(ListRequest) returns (DocumentListResult);
  rpc DocumentMove(MoveRequest) returns (DocumentResponse);
  rpc DocumentExists(ExistsRequest) returns (ExistsResult);

  // Search operations
  rpc SearchFullText(SearchRequest) returns (SearchResponse);
  rpc SearchRegex(GrepRequest) returns (GrepResponse);
  rpc SearchGlob(GlobRequest) returns (GlobResponse);

  // History operations
  rpc HistoryList(HistoryRequest) returns (VersionListResponse);
  rpc HistoryDiff(DiffRequest) returns (DiffResponse);
  rpc HistoryRevert(RevertRequest) returns (DocumentResponse);

  // Tag operations
  rpc TagAdd(TagRequest) returns (EmptyResponse);
  rpc TagRemove(TagRequest) returns (EmptyResponse);
  rpc TagList(TagListRequest) returns (TagListResult);

  // Link operations
  rpc LinkAdd(LinkRequest) returns (LinkResponse);
  rpc LinkRemove(UnlinkRequest) returns (EmptyResponse);
  rpc LinkList(LinkListRequest) returns (LinkListResult);

  // Entity operations (for plugin state)
  rpc EntityRead(EntityRequest) returns (EntityResponse);
  rpc EntityWrite(EntityWriteRequest) returns (EntityResponse);
  rpc EntityDelete(EntityRequest) returns (EmptyResponse);
  rpc EntityList(EntityListRequest) returns (EntityListResult);

  // Event operations
  rpc EventSubscribe(SubscribeRequest) returns (EmptyResponse);
  rpc EventEmit(EmitRequest) returns (EmptyResponse);
}

// Common messages
message Empty {}

// Response wrappers - all RPCs return success/error in response, never Go errors
message EmptyResponse {
  bool success = 1;
  string error = 2;
}

message DocumentResponse {
  bool success = 1;
  string error = 2;
  Document document = 3;
}

message DocumentListResult {
  bool success = 1;
  string error = 2;
  repeated Document documents = 3;
}

message ExistsResult {
  bool success = 1;
  string error = 2;
  bool exists = 3;
}

message SearchResponse {
  bool success = 1;
  string error = 2;
  repeated SearchMatch matches = 3;
}

message GrepResponse {
  bool success = 1;
  string error = 2;
  repeated GrepMatch matches = 3;
}

message GlobResponse {
  bool success = 1;
  string error = 2;
  repeated string paths = 3;
}

message VersionListResponse {
  bool success = 1;
  string error = 2;
  repeated VersionInfo versions = 3;
}

message DiffResponse {
  bool success = 1;
  string error = 2;
  string diff = 3;
}

message TagListResult {
  bool success = 1;
  string error = 2;
  repeated string tags = 3;
}

message LinkResponse {
  bool success = 1;
  string error = 2;
  Link link = 3;
}

message LinkListResult {
  bool success = 1;
  string error = 2;
  repeated Link links = 3;
}

message EntityResponse {
  bool success = 1;
  string error = 2;
  Entity entity = 3;
}

message EntityListResult {
  bool success = 1;
  string error = 2;
  repeated Entity entities = 3;
}

// Document messages
message ReadRequest {
  string path = 1;
  optional int32 version = 2;
}

message WriteRequest {
  string path = 1;
  bytes content = 2;
  string author = 3;
  string message = 4;
}

message EditRequest {
  string path = 1;
  string old_text = 2;
  string new_text = 3;
  string author = 4;
  string message = 5;
}

message DeleteRequest {
  string path = 1;
  string author = 2;
}

message RestoreRequest {
  string path = 1;
  string author = 2;
}

message ListRequest {
  string prefix = 1;
  bool include_deleted = 2;
  string sort = 3;
  bool reverse = 4;
}

message MoveRequest {
  string source = 1;
  string dest = 2;
  string author = 3;
}

message ExistsRequest {
  string path = 1;
}


message Document {
  string path = 1;
  bytes content = 2;
  int32 version = 3;
  string author = 4;
  string message = 5;
  int64 created_at = 6;
  bool deleted = 7;
}


// Search messages
message SearchRequest {
  string query = 1;
  string prefix = 2;
}


message SearchMatch {
  string path = 1;
  string snippet = 2;
  float score = 3;
}

message GrepRequest {
  string pattern = 1;
  string path = 2;
  bool ignore_case = 3;
  int32 context_lines = 4;
}


message GrepMatch {
  string path = 1;
  int32 line = 2;
  string content = 3;
  repeated string context_before = 4;
  repeated string context_after = 5;
}

message GlobRequest {
  string pattern = 1;
}


// History messages
message HistoryRequest {
  string path = 1;
  int32 limit = 2;
}


message VersionInfo {
  int32 version = 1;
  string author = 2;
  string message = 3;
  int64 created_at = 4;
}

message DiffRequest {
  string path = 1;
  int32 version1 = 2;
  int32 version2 = 3;
}


message RevertRequest {
  string path = 1;
  int32 version = 2;
  string author = 3;
}

// Tag messages
message TagRequest {
  string path = 1;
  string tag = 2;
  string author = 3;
}

message TagListRequest {
  string path = 1;
}


// Link messages
message LinkRequest {
  string from = 1;
  string to = 2;
  string tag = 3;
  string author = 4;
}

message UnlinkRequest {
  string id = 1;
  string author = 2;
}

message LinkListRequest {
  string path = 1;
}

message Link {
  string id = 1;
  string from = 2;
  string to = 3;
  string tag = 4;
}


// Entity messages
message EntityRequest {
  string namespace = 1;
  string path = 2;
}

message EntityWriteRequest {
  string namespace = 1;
  string path = 2;
  bytes value = 3;
  string author = 4;
}

message Entity {
  string namespace = 1;
  string path = 2;
  bytes value = 3;
  int64 created_at = 4;
}

message EntityListRequest {
  string namespace = 1;
  string prefix = 2;
}


// Event messages
message SubscribeRequest {
  repeated string event_types = 1;
}

message EmitRequest {
  string type = 1;
  string path = 2;
  map<string, string> metadata = 3;
}
